<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Aviary</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1210;--glass:rgba(22,32,26,.72);--line:rgba(255,248,235,.12);--tx:#faf6ef;--mu:#b8c4b4;--ac:#c9a24c;--ac2:#6db88a;--m:#6ba3c9;--f:#d4849a;--r:20px;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 var(--sans)}
body:before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 70% 20%,rgba(201,162,76,.08),transparent 55%),linear-gradient(180deg,rgba(12,18,16,.15) 0%,rgba(12,18,16,.88) 72%)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.92}
header,main,footer{position:relative;z-index:1}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;background:rgba(12,18,16,.55);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,.12)}
header nav{display:flex;align-items:center;gap:6px}
header a{text-decoration:none;margin-left:18px;color:var(--mu);font-size:14px;font-weight:500;letter-spacing:.02em}

.wrap{max-width:1180px;margin:0 auto;padding:28px 5vw;animation:up .5s both}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px;padding:0 5vw;max-width:1180px;margin:0 auto}
.kick{letter-spacing:.22em;text-transform:uppercase;color:var(--ac);font-size:12px;margin:0;font-weight:600}
h1,h2,.info h1{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(44px,8vw,88px);line-height:1.02;margin:0;color:var(--tx);text-shadow:0 2px 40px rgba(0,0,0,.25)}
h1 span{display:block;font-size:.42em;font-weight:500;color:var(--ac2);font-style:italic;margin-top:.15em;letter-spacing:0}
h2{font-weight:600;margin:34px 0 14px;font-size:clamp(26px,4vw,34px)}h2 small{color:var(--mu);font-size:15px;font-family:var(--sans);font-weight:500;margin-left:10px}
.sub{color:var(--mu);max-width:560px;font-size:18px;margin:0;line-height:1.7}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;margin:18px 0 0;padding:0;list-style:none;color:var(--mu);font-size:14px}
.trust li{display:flex;align-items:center;gap:8px}.trust li:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ac2);box-shadow:0 0 12px rgba(109,184,138,.6)}
.section-lead{color:var(--mu);max-width:640px;margin:-6px 0 22px;font-size:16px}
.btn{display:inline-block;border:0;border-radius:999px;padding:13px 28px;font:600 15px var(--sans);color:#1a1510;background:linear-gradient(135deg,#e8c875,var(--ac));cursor:pointer;text-decoration:none;box-shadow:0 10px 32px -10px rgba(201,162,76,.55);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px -8px rgba(201,162,76,.65)}
.btn.ghost{background:rgba(255,248,235,.08);color:var(--tx);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.ghost:hover{background:rgba(255,248,235,.14)}
.btn.s{padding:7px 16px;font-size:13px;background:rgba(255,248,235,.1);color:var(--tx);box-shadow:none;font-weight:500}.btn.d{color:#ffb4b4}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.15)}.pad{padding:24px}
.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}
input,select,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}select option{color:#000}textarea{min-height:80px}
input[type=checkbox]{width:20px;height:20px}.bar input{flex:1;min-width:200px}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;perspective:900px}
.card{display:block;color:inherit;text-decoration:none;border-radius:var(--r);overflow:hidden;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);transition:transform .2s,box-shadow .25s,border-color .25s;animation:up .6s both;animation-delay:calc(var(--i)*40ms);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card:hover{box-shadow:0 22px 50px -18px rgba(201,162,76,.35);border-color:rgba(201,162,76,.35)}
.ph{aspect-ratio:1;display:grid;place-items:center;font-size:64px;background:linear-gradient(145deg,#1a2820,#0f1612);position:relative}
.ph img{width:100%;height:100%;object-fit:cover}.ph i{position:absolute;top:12px;right:12px;width:11px;height:11px;border-radius:50%;background:#888;box-shadow:0 0 0 3px rgba(0,0,0,.25)}.ph i.male{background:var(--m)}.ph i.female{background:var(--f)}
.ci{padding:16px 18px 18px;display:grid;gap:4px}.ci small,.mu{color:var(--mu)}.ci em{color:var(--ac);font-style:normal;font-size:14px;font-weight:500}
.ci .cta{margin-top:8px;font-size:13px;font-weight:600;color:var(--ac2);letter-spacing:.02em}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}@media(max-width:820px){.two{grid-template-columns:1fr}}
.main{border-radius:var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1a2820,#0f1612);border:1px solid var(--line);width:100%;min-height:180px;padding:10px}
.main img{display:block;max-width:100%;width:auto;height:auto;max-height:min(72vh,820px);object-fit:contain;object-position:center}.big{font-size:90px}
.thumbs{display:flex;gap:10px;margin:12px 0;overflow-x:auto}.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:12px;cursor:pointer;border:1px solid var(--line);flex-shrink:0}
.thumbs img.on{border-color:var(--ac);box-shadow:0 0 0 2px rgba(201,162,76,.35)}
.vid{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000;margin-top:12px}.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4d6d;margin-right:8px;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.25}}
.info{padding:26px}.info h1{font-size:44px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tag{padding:3px 12px;border-radius:99px;font-size:13px;background:rgba(255,255,255,.1)}.tag.male{background:rgba(90,176,255,.2);color:var(--m)}.tag.female{background:rgba(255,122,200,.2);color:var(--f)}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:14px 0}dt{color:var(--mu)}dd{margin:0}
.chips span{display:inline-block;margin:0 8px 8px 0;padding:5px 14px;border-radius:99px;border:1px solid rgba(109,184,138,.45);color:var(--ac2);font-size:14px;background:rgba(109,184,138,.08)}
.tl{border-left:2px solid var(--line);padding-left:16px;margin:10px 0}.tl div{margin-bottom:10px}.tl small{color:var(--mu)}
.dg{padding:14px;overflow-x:auto}.dg svg{width:100%;min-width:560px;height:auto}
.nd{cursor:pointer}.nd rect{fill:rgba(20,24,46,.92);stroke-width:1.5;transition:.2s}.nd:hover rect{fill:rgba(60,50,120,.9)}.nd text{fill:#fff;font-size:13px}.nd .s{fill:var(--mu);font-size:11px}
.nd.me rect{fill:rgba(201,162,76,.28);filter:drop-shadow(0 0 10px rgba(201,162,76,.45))}.ln{fill:none;stroke:rgba(255,248,235,.2);stroke-width:1.5}.ln.past{stroke-dasharray:5 5}
.pill{fill:rgba(109,184,138,.12);stroke:var(--ac2)}.pt{fill:var(--ac2);font-size:12px;text-anchor:middle}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:transparent;color:var(--mu);padding:8px 18px;border-radius:99px;cursor:pointer;font:inherit}.tabs .on{background:linear-gradient(135deg,#e8c875,var(--ac));color:#1a1510;border-color:transparent;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;margin-top:10px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,12,10,.72);display:grid;place-items:center;padding:16px;overflow:auto}.modal>div{width:min(720px,100%);max-height:92vh;overflow:auto;background:#141c18}
.modal.wide>div{width:min(980px,100%)}.av-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.av-head h3{margin:0;font-family:var(--serif);font-size:28px}.av-sec{margin-top:22px}.av-sec h4{margin:0 0 10px;font-size:15px;color:var(--ac);letter-spacing:.04em;text-transform:uppercase}
.av-dl{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;margin:0}.av-dl dt{color:var(--mu)}.av-dl dd{margin:0;word-break:break-word}
.av-ph{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.av-ph img{width:88px;height:88px;object-fit:contain;background:rgba(0,0,0,.2);border-radius:12px;border:1px solid var(--line)}
.row span:last-child{flex-shrink:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.fg{grid-template-columns:1fr}}.fg label{display:grid;gap:4px;color:var(--mu);font-size:13px;text-transform:capitalize}
.act{display:flex;gap:10px;margin-top:18px}.pth{display:inline-block;position:relative;margin:8px 8px 0 0}.pth img{width:70px;height:70px;object-fit:cover;border-radius:10px}.pth b{position:absolute;top:-6px;right:-6px;background:#ff4d6d;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer;font-size:13px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2420;border:1px solid var(--ac);padding:10px 20px;border-radius:99px;z-index:30;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}#toast.on{opacity:1}
footer{text-align:center;color:var(--mu);padding:48px 5vw 56px;font-size:14px;line-height:1.8;border-top:1px solid var(--line);background:rgba(12,18,16,.4)}
footer strong{display:block;color:var(--tx);font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="gl"></canvas>
<header><a class="logo" href="#/" id="brand"></a><nav><a href="#/">Our birds</a><a href="#/admin" class="nav-staff">Staff login</a></nav></header>
<main id="app"></main><footer><strong id="foot-brand"></strong><span id="foot-note">Ethically bred companions · documented lineage · photos &amp; video on every profile</span></footer><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ───────── CONFIG: paste your Supabase values; leave URL empty for demo mode ───────── */
const C={SUPABASE_URL:'https://hjgnomjawhozlquobspb.supabase.co',SUPABASE_KEY:'sb_publishable_7WwxpRTnGQ3wqkfTqbLA0w_cl7EHngq',NAME:'M.S.K Aviaries',TAGLINE:'Hand-raised parrots with clear lineage, photos, and care history — so you can choose your companion with confidence.',HERO_ACCENT:'Where quality breeding meets a loving home.',LIVE_URL:''};
const DEMO=!C.SUPABASE_URL,sb=DEMO?null:supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),nm=s=>E(String(s||'').slice(0,13));
$('#brand').textContent=C.NAME;document.title=C.NAME+' · Premium hand-raised parrots';
$('#foot-brand').textContent=C.NAME;
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2600)};
const pu=p=>sb.storage.from('bird-photos').getPublicUrl(p).data.publicUrl;
/* ───────── demo data ───────── */
const DB=[{id:'1',name:'Sol',sex:'male',species:'Cockatiel',ring_number:'AB 1234',phenotype:'Lutino',genotype:'Lutino (visual), split Pied',status:'breeder',line_name:'Sunrise line',bred_by:'Green Aviary',origin_description:'Brought in as a young bird from a trusted breeder.'},
{id:'2',name:'Luna',sex:'female',species:'Cockatiel',ring_number:'no ring',phenotype:'Normal grey',genotype:'Normal, split Lutino',status:'breeder',line_name:'Moonlight line'},
{id:'3',name:'Ember',sex:'male',species:'Cockatiel',ring_number:'CD 77',phenotype:'Normal grey',genotype:'Normal, split Lutino',line_name:'Sunrise line',f:'1',m:'2',c:'Clutch 1, 2026'},
{id:'4',name:'Dawn',sex:'female',species:'Cockatiel',ring_number:'CD 78',phenotype:'Lutino',genotype:'Lutino (visual)',line_name:'Sunrise line',f:'1',m:'2',c:'Clutch 1, 2026'},
{id:'5',name:'Pip',sex:'unknown',species:'Cockatiel',ring_number:'no ring',phenotype:'Normal grey',genotype:'Normal, split Lutino',line_name:'Sunrise line',f:'1',m:'2',c:'Clutch 2, 2026'}];
const blk=(a,b)=>{const f=DB.find(x=>x.id==a),m=DB.find(x=>x.id==b),fl=f?.line_name||'',ml=m?.line_name||'',comb=[fl,ml].filter((x,i,a)=>x&&a.indexOf(x)===i);return{father:f,mother:m,lines_cross:{father_line:fl,mother_line:ml,combined:comb},chicks:DB.filter(x=>x.f==a&&x.m==b).map(x=>({...x,clutch:x.c}))}};
const demoProfile=id=>{const b=DB.find(x=>x.id==id);return b&&{bird:b,description:b.origin_description||null,lines_carried:[b.line_name].filter(Boolean),history:b.bred_by?[{name:b.bred_by,role:'breeder',from_year:2023}]:[],origin:b.f?blk(b.f,b.m):null,current_pairing:id=='1'||id=='2'?blk('1','2'):null,past_pairings:[]}};
/* ───────── media ───────── */
function embed(u){const y=u.match(/(?:youtu\.be\/|v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
 if(y)return `<iframe src="https://www.youtube.com/embed/${y[1]}" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
 if(/\.(mp4|webm)(\?|$)/i.test(u))return `<video src="${E(u)}" controls muted loop playsinline></video>`;
 return `<a class="btn" target="_blank" rel="noopener" href="${E(u)}">Watch video ↗</a>`}
function fitMainPhoto(img){if(!img?.naturalWidth)return;img.removeAttribute('width');img.removeAttribute('height')}
function pickPhoto(src,el){const mi=$('#mi');if(!mi)return;mi.src=src;const go=()=>{fitMainPhoto(mi);document.querySelectorAll('.thumbs img').forEach(t=>t.classList.toggle('on',t===el));};mi.onload=go;if(mi.complete)go()}
let BIRDS=null,PH={},PHS={};
async function ensureBirds(){if(BIRDS)return;if(DEMO){BIRDS=DB;return}
 const [b,p]=await Promise.all([sb.from('public_birds').select('*').order('name'),sb.from('bird_photos').select('*').order('sort_order')]);
 BIRDS=b.data||[];PHS={};PH={};(p.data||[]).sort((x,y)=>y.is_primary-x.is_primary).forEach(r=>(PHS[r.bird_id]=PHS[r.bird_id]||[]).push(pu(r.path)));for(const k in PHS)PH[k]=PHS[k][0]}
/* ───────── lineage diagram: one pair + only its chicks ───────── */
function pairLabel(blk){const x=blk.lines_cross||{},fl=x.father_line||blk.father?.line_name||'',ml=x.mother_line||blk.mother?.line_name||'';return fl&&ml?fl+' × '+ml:fl||ml||'Pairing'}
function adminBird(c){if(!c?.id||!A.birds?.length)return c;const x=A.birds.find(b=>b.id==c.id);return x?{...c,...x}:c}
function adminBlk(blk){if(!blk)return blk;return{...blk,father:adminBird(blk.father),mother:adminBird(blk.mother),chicks:(blk.chicks||[]).map(adminBird)}}
function pairSVG(blk,self,past,adm){const W=760,cw=150,ch=46,g=14,cx=W/2;let y=118,o='';
 const node=(c,x,y)=>{const b=adm?adminBird(c):c,col=b.sex=='male'?'var(--m)':b.sex=='female'?'var(--f)':'#888',p=PH[b.id],tx=p?46:12,sub=adm?nm(b.ring_number||'no ring'):nm(b.line_name||'—');
  return `<g class="nd${b.id==self?' me':''}" onclick="location.hash='#/bird/${b.id}'" transform="translate(${x},${y})"><rect width="${cw}" height="${ch}" rx="14" style="stroke:${col}"/>${p?`<image href="${p}" x="6" y="6" width="34" height="34" preserveAspectRatio="xMidYMid slice" style="clip-path:circle(50%)"/>`:''}<text x="${tx}" y="20">${nm(b.name)}</text><text x="${tx}" y="36" class="s">${sub}</text></g>`};
 const pl=E(String(pairLabel(blk)||'').slice(0,28));o+=`<path class="ln ${past?'past':''}" d="M${cx-40} 43H${cx+40}"/><rect class="pill" x="${cx-72}" y="28" width="144" height="30" rx="15"/><text x="${cx}" y="48" class="pt">${pl}</text>`;
 o+=node(blk.father,cx-cw-40,20)+node(blk.mother,cx+40,20);
 const gr={};(blk.chicks||[]).forEach(c=>(gr[c.clutch||'Chicks']=gr[c.clutch||'Chicks']||[]).push(c));
 o=`<path class="ln ${past?'past':''}" d="M${cx} 55V${y}"/>`+o;let last=y;
 for(const k in gr){const a=gr[k],cols=4,rows=Math.ceil(a.length/cols);
  o+=`<path class="ln" d="M${cx} ${last}V${y}"/><rect class="pill" x="${cx-80}" y="${y}" width="160" height="26" rx="13"/><text class="pt" x="${cx}" y="${y+17}">${E(k)}</text>`;
  a.forEach((c,i)=>{const r=Math.floor(i/cols),n=Math.min(cols,a.length-r*cols),x=(W-(n*(cw+g)-g))/2+(i%cols)*(cw+g),cy=y+54+r*(ch+g);
   o=`<path class="ln" d="M${cx} ${y+26}C${cx} ${cy-14},${x+cw/2} ${cy-14},${x+cw/2} ${cy}"/>`+o+node(c,x,cy)});
  last=y;y+=54+rows*(ch+g)+16}
 return `<svg viewBox="0 0 ${W} ${y}" role="img" aria-label="Lineage diagram">${o}</svg>`}
/* ───────── pages ───────── */
const app=$('#app');
function route(){const h=location.hash.slice(2).split('/');scrollTo(0,0);h[0]=='bird'?bird(h[1]):h[0]=='admin'?admin():home()}
addEventListener('hashchange',route);
async function home(){
 app.innerHTML=`<section class="hero"><p class="kick">Ethical breeding · family raised</p><h1>${E(C.NAME)}<span>${E(C.HERO_ACCENT||'')}</span></h1><p class="sub">${E(C.TAGLINE)}</p><div class="hero-actions"><a class="btn" onclick="$('#list').scrollIntoView({behavior:'smooth'})">Browse our birds</a><a class="btn ghost" onclick="$('#list').scrollIntoView({behavior:'smooth'})">View lineage &amp; photos</a></div><ul class="trust"><li>Full pedigree records</li><li>Photos &amp; video on profiles</li><li>Transparent breeding history</li></ul></section>
 ${C.LIVE_URL?`<section class="wrap"><h2><span class="dot"></span>Live aviary cam</h2><p class="section-lead">See our birds in real time before you visit or reserve.</p><div class="vid">${embed(C.LIVE_URL)}</div></section>`:''}
 <section class="wrap" id="list"><h2>Available &amp; showcase birds</h2><p class="section-lead">Each profile includes mutation details, breeding line, lineage diagrams, and media — everything you need before making an enquiry.</p><div class="bar"><input id="q" placeholder="Search by name, species, colour, line…"><select id="sx"><option value="">All birds</option><option>male</option><option>female</option><option>unknown</option></select></div><div class="grid" id="grid"></div></section>`;
 await ensureBirds();draw();$('#q').oninput=$('#sx').onchange=draw;
 const g=$('#grid');g.onmousemove=e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*10+'deg');c.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*10+'deg')};
 g.onmouseout=e=>{const c=e.target.closest('.card');c&&(c.style.removeProperty('--rx'),c.style.removeProperty('--ry'))}}
function draw(){const s=$('#q').value.toLowerCase(),x=$('#sx').value;
 $('#grid').innerHTML=BIRDS.filter(b=>(!x||b.sex==x)&&[b.name,b.species,b.phenotype,b.line_name].join(' ').toLowerCase().includes(s)).map((b,i)=>
 `<a class="card" style="--i:${i}" href="#/bird/${b.id}"><div class="ph">${PH[b.id]?`<img loading="lazy" src="${PH[b.id]}" alt="${E(b.name)}">`:'🦜'}<i class="${b.sex}"></i></div><div class="ci"><b>${E(b.name)}</b><small>${E(b.species||'Parrot')}${b.line_name?' · '+E(b.line_name):''}</small><em>${E(b.phenotype||'See profile')}</em><span class="cta">View full profile →</span></div></a>`).join('')||'<p class="mu">No birds match your search — try clearing filters or check back soon for new arrivals.</p>'}
async function bird(id){app.innerHTML='<div class="wrap mu">Loading…</div>';await ensureBirds();
 const p=DEMO?demoProfile(id):(await sb.rpc('public_bird_profile',{p_bird:id})).data;
 if(!p){app.innerHTML='<div class="wrap"><a href="#/">← Back</a><p>Bird not found.</p></div>';return}

let TAB='birds';const A={};
const bn=id=>(A.birds.find(x=>x.id==id)||{}).name||'?';
const L={birds:r=>`${r.name} (${r.ring_number||'no ring'})`,pairings:r=>`${bn(r.male_id)} × ${bn(r.female_id)}`,clutches:r=>r.label||r.laid_on||'Clutch'};
const T={
 birds:{n:'Birds',t:r=>L.birds(r),f:[['name','text'],['species','text'],['sex','sel:male,female,unknown'],['ring_number','text'],['hatch_date','date'],['phenotype','text'],['genotype','text'],['status','text'],['father_id','ref:birds:male'],['mother_id','ref:birds:female'],['clutch_id','ref:clutches'],['bred_by','text'],['line_name','text'],['video_url','text'],['origin_description','area'],['parents_note','text'],['notes','area']]},
 pairings:{n:'Pairings',t:r=>L.pairings(r)+(r.ended_on?' · ended '+r.ended_on:' · current'),f:[['male_id','ref:birds:male'],['female_id','ref:birds:female'],['started_on','date'],['ended_on','date'],['show_after_end','bool'],['notes','area']]},
 clutches:{n:'Clutches',t:r=>(r.label||'Clutch')+' · '+L.pairings(A.pairings.find(p=>p.id==r.pairing_id)||{}),f:[['pairing_id','ref:pairings'],['label','text'],['laid_on','date'],['eggs_laid','num'],['notes','area']]},
 bird_history:{n:'History',t:r=>bn(r.bird_id)+': '+r.person_name,f:[['bird_id','ref:birds'],['person_name','text'],['role','sel:breeder,owner'],['from_year','num'],['to_year','num'],['notes','area'],['show_publicly','bool'],['sort_order','num']]},
 bird_private:{n:'Private',pk:'bird_id',t:r=>bn(r.bird_id)+' (private)',f:[['bird_id','ref:birds'],['bought_from_name','text'],['bought_from_phone','text'],['bought_on','date'],['bought_price','num'],['sold_to_name','text'],['sold_to_phone','text'],['sold_on','date'],['sold_price','num'],['asking_price','num'],['notes','area']]}};
async function loadAdmin(){for(const t of [...Object.keys(T),'bird_photos']){const {data}=await sb.from(t).select('*');A[t]=data||[]}A.birds.sort((a,b)=>a.name.localeCompare(b.name))}
async function admin(){
 if(DEMO){app.innerHTML='<div class="wrap"><div class="glass pad"><h2 style="margin-top:0">Admin</h2><p>Demo mode. Add your Supabase URL and key at the top of this file to turn on login and editing.</p></div></div>';return}
 const {data:{session}}=await sb.auth.getSession();
 if(!session){app.innerHTML=`<div class="wrap" style="max-width:440px"><div class="glass pad"><h2 style="margin-top:0">Admin login</h2><div class="fg" style="grid-template-columns:1fr"><label>username<input id="em" type="text" autocomplete="username" placeholder="admin"></label><label>password<input id="pw" type="password" autocomplete="current-password"></label></div><div class="act"><button class="btn" onclick="login()">Sign in</button></div></div></div>`;return}
 await loadAdmin();adminView()}
async function login(){let u=$('#em').value.trim();if(!u.includes('@'))u=u+'@mskaviaries.com';const {error}=await sb.auth.signInWithPassword({email:u,password:$('#pw').value});error?toast(error.message):admin()}
function adminView(){
 app.innerHTML=`<div class="wrap"><div class="bar"><h2 style="margin:0">Admin</h2><span><button class="btn s" onclick="exportAll()">Export CSV</button> <button class="btn s" onclick="sb.auth.signOut().then(route)">Sign out</button></span></div>
 <div class="tabs">${Object.keys(T).map(k=>`<button class="${k==TAB?'on':''}" onclick="TAB='${k}';adminView()">${T[k].n}</button>`).join('')}</div>
 <button class="btn" onclick="edit()">+ Add</button>${A[TAB].map(r=>{const k=r[T[TAB].pk||'id'];const vb=TAB=='birds'?`<button class="btn s" onclick="viewBird('${k}')">View as admin</button> `:'';return `<div class="row glass"><span>${E(T[TAB].t(r))}</span><span>${vb}<button class="btn s" onclick="edit('${k}')">Edit</button> <button class="btn s d" onclick="del('${k}')">Delete</button></span></div>`}).join('')}</div>`}
function avRow(k,v){return v!=null&&v!==''?`<dt>${k}</dt><dd>${E(String(v))}</dd>`:''}
function avRef(id){const x=A.birds.find(b=>b.id==id);return x?L.birds(x):''}
function avMoney(n){return n==null||n===''?'':Number(n).toLocaleString()}
function cacheAdminPhotos(){PHS={};PH={};A.bird_photos.sort((a,b)=>a.sort_order-b.sort_order).forEach(r=>{const u=pu(r.path);(PHS[r.bird_id]=PHS[r.bird_id]||[]).push(u);if(r.is_primary||!PH[r.bird_id])PH[r.bird_id]=u})}
async function viewBird(id){
 const b=A.birds.find(x=>x.id==id);if(!b)return toast('Bird not found');
 const priv=A.bird_private.find(x=>x.bird_id==id),hist=A.bird_history.filter(x=>x.bird_id==id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),photos=A.bird_photos.filter(x=>x.bird_id==id).sort((a,b)=>a.sort_order-b.sort_order);
 cacheAdminPhotos();
 const {data:profile}=await sb.rpc('public_bird_profile',{p_bird:id});
 let lin='';if(profile){if(profile.origin)lin+=`<div class="av-sec"><h4>Origin · ring numbers shown</h4><div class="dg glass">${pairSVG(adminBlk(profile.origin),id,0,1)}</div></div>`;if(profile.current_pairing)lin+=`<div class="av-sec"><h4>Current pairing · ${E(pairLabel(profile.current_pairing))}</h4><div class="dg glass">${pairSVG(adminBlk(profile.current_pairing),id,0,1)}</div></div>`;(profile.past_pairings||[]).forEach(x=>{lin+=`<div class="av-sec"><h4>Previous pairing · ${E(pairLabel(x))}</h4><div class="dg glass">${pairSVG(adminBlk(x),id,1,1)}</div></div>`})}
 const m=document.createElement('div');m.className='modal wide';m.id='m';m.innerHTML=`<div class="glass pad"><div class="av-head"><div><h3>${E(b.name)}</h3><div class="tags"><span class="tag ${b.sex}">${b.sex}</span>${b.status?`<span class="tag">${E(b.status)}</span>`:''}<span class="tag">Admin view</span></div></div><div class="act" style="margin:0"><button class="btn s" onclick="location.hash='#/bird/${id}'">Public page</button><button class="btn s" onclick="$('#m').remove();edit('${id}')">Edit</button><button class="btn s" onclick="$('#m').remove()">Close</button></div></div>
 ${photos.length?`<div class="av-sec"><h4>Photos</h4><div class="av-ph">${photos.map(p=>`<img src="${pu(p.path)}" alt="">`).join('')}</div></div>`:''}
 ${b.video_url?`<div class="av-sec"><h4>Video</h4><div class="vid">${embed(b.video_url)}</div></div>`:''}
 <div class="av-sec"><h4>Bird record</h4><dl class="av-dl">${avRow('Ring',b.ring_number)}${avRow('Species',b.species)}${avRow('Line',b.line_name)}${avRow('Phenotype',b.phenotype)}${avRow('Genotype',b.genotype)}${avRow('Hatched',b.hatch_date)}${avRow('Status',b.status)}${avRow('Bred by',b.bred_by)}${avRow('Father',avRef(b.father_id))}${avRow('Mother',avRef(b.mother_id))}${avRow('Clutch',(()=>{const c=A.clutches.find(x=>x.id==b.clutch_id);return c?L.clutches(c):''})())}${avRow('Video',b.video_url)}${avRow('Origin story',b.origin_description)}${avRow('Parents note',b.parents_note)}${avRow('Notes',b.notes)}${avRow('Created',b.created_at?.slice?.(0,10)||b.created_at)}${avRow('Updated',b.updated_at?.slice?.(0,10)||b.updated_at)}</dl></div>
 ${priv?`<div class="av-sec"><h4>Private · sales &amp; contacts</h4><dl class="av-dl">${avRow('Bought from',priv.bought_from_name)}${avRow('Seller phone',priv.bought_from_phone)}${avRow('Bought on',priv.bought_on)}${avRow('Bought price',avMoney(priv.bought_price))}${avRow('Sold to',priv.sold_to_name)}${avRow('Buyer phone',priv.sold_to_phone)}${avRow('Sold on',priv.sold_on)}${avRow('Sold price',avMoney(priv.sold_price))}${avRow('Asking price',avMoney(priv.asking_price))}${avRow('Notes',priv.notes)}</dl></div>`:'<div class="av-sec"><h4>Private</h4><p class="mu">No private record yet.</p></div>'}
 ${hist.length?`<div class="av-sec"><h4>History (${hist.length})</h4><div class="tl">${hist.map(h=>`<div><b>${E(h.person_name)}</b> <small>${E(h.role)}${h.from_year?' · '+h.from_year:''}${h.to_year?'–'+h.to_year:''}${h.show_publicly?' · public':' · hidden'}</small>${h.notes?`<br><small>${E(h.notes)}</small>`:''}</div>`).join('')}</div></div>`:'<div class="av-sec"><h4>History</h4><p class="mu">No history entries.</p></div>'}
 ${profile?.lines_carried?.length?`<div class="av-sec"><h4>Lines carried</h4><div class="chips">${profile.lines_carried.map(l=>`<span>${E(l)}</span>`).join('')}</div></div>`:''}
 ${lin}<div class="act"><button class="btn s" onclick="$('#m').remove();edit('${id}')">Edit bird</button><button class="btn s" onclick="$('#m').remove()">Close</button></div></div>`;document.body.append(m)}
function edit(key){const c=T[TAB],pk=c.pk||'id',r=key?A[TAB].find(x=>x[pk]==key):{};
 const fld=([n,ty])=>{const v=r[n]??'';let i;
  if(ty=='area')i=`<textarea name="${n}">${E(v)}</textarea>`;
  else if(ty=='bool')i=`<input type="checkbox" name="${n}" ${r[n]?'checked':''}>`;
  else if(ty.startsWith('sel:'))i=`<select name="${n}">${ty.slice(4).split(',').map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(ty.startsWith('ref:')){const [,t,s]=ty.split(':');i=`<select name="${n}"><option value="">—</option>${A[t].filter(o=>!s||o.sex==s).map(o=>`<option value="${o.id}" ${o.id==v?'selected':''}>${E(L[t](o))}</option>`).join('')}</select>`}
  else i=`<input name="${n}" type="${ty=='num'?'number':ty=='date'?'date':'text'}" step="any" value="${E(v)}">`;
  return `<label>${n.replace(/_/g,' ')}${i}</label>`};
 const ph=TAB=='birds'?`<label style="margin-top:14px">photos (resized automatically)<input id="pf" type="file" accept="image/*" multiple></label>${(key?A.bird_photos.filter(p=>p.bird_id==key):[]).map(p=>`<span class="pth"><img src="${pu(p.path)}" alt=""><b onclick="delPhoto('${p.id}','${p.path}','${key}')">×</b></span>`).join('')}`:'';
 const m=document.createElement('div');m.className='modal';m.id='m';m.innerHTML=`<div class="glass pad"><h3 style="margin-top:0">${key?'Edit':'Add'} · ${c.n}</h3><div class="fg">${c.f.map(fld).join('')}</div>${ph}<div class="act"><button class="btn" onclick="save('${key||''}')">Save</button><button class="btn s" onclick="$('#m').remove()">Cancel</button></div></div>`;document.body.append(m)}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};i.src=URL.createObjectURL(f)});
async function save(key){const c=T[TAB],o={};
 for(const [n,ty] of c.f){const e=$('#m [name='+n+']');let v=ty=='bool'?e.checked:e.value;if(v==='')v=null;else if(ty=='num')v=Number(v);o[n]=v}
 let q;if(c.pk)q=sb.from(TAB).upsert(o);else if(key)q=sb.from(TAB).update(o).eq('id',key);else q=sb.from(TAB).insert(o).select('id').single();
 const {data,error}=await q;if(error)return toast(error.message);
 if(TAB=='birds'){const id=key||data.id,fs=[...($('#pf').files||[])],have=A.bird_photos.filter(p=>p.bird_id==id).length;
  for(let i=0;i<fs.length;i++){const path=`${id}/${Date.now()}_${i}.jpg`,up=await sb.storage.from('bird-photos').upload(path,await shrink(fs[i]),{contentType:'image/jpeg'});
   if(up.error){toast(up.error.message);continue}await sb.from('bird_photos').insert({bird_id:id,path,is_primary:!have&&!i,sort_order:have+i})}}
 BIRDS=null;$('#m').remove();await loadAdmin();adminView();toast('Saved')}
async function delPhoto(id,path,key){await sb.storage.from('bird-photos').remove([path]);await sb.from('bird_photos').delete().eq('id',id);BIRDS=null;await loadAdmin();$('#m').remove();edit(key)}
async function del(key){if(!confirm('Delete this record? This cannot be undone.'))return;const {error}=await sb.from(TAB).delete().eq(T[TAB].pk||'id',key);error?toast(error.message):(BIRDS=null,await loadAdmin(),adminView(),toast('Deleted'))}
function exportAll(){for(const t of [...Object.keys(T),'bird_photos']){const a=A[t];if(!a.length)continue;const k=Object.keys(a[0]),csv=[k.join(','),...a.map(r=>k.map(c=>JSON.stringify(r[c]??'')).join(','))].join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));l.download=t+'.csv';l.click()}}
/* ───────── WebGL: shader background + 3D orb ───────── */
try{
const FS=`uniform float t;uniform vec2 r;uniform vec2 m;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.;a*=.5;}return v;}
void main(){vec2 u=gl_FragCoord.xy/r;vec2 p=(u-.5)*vec2(r.x/r.y,1.)*3.;float q=fbm(p+t*.06);float w=fbm(p+q*2.+m*.5+t*.04);
vec3 forest=vec3(.08,.14,.10);vec3 leaf=vec3(.22,.42,.28);vec3 gold=vec3(.78,.58,.28);vec3 c=mix(mix(forest,leaf,w),gold,w*w);
c=mix(vec3(.05,.07,.06),c,smoothstep(.22,.88,w)*.58);c+=vec3(.06,.04,.02)*(1.-u.y)*.35;gl_FragColor=vec4(c,1.);}`;
const VS=`uniform float t;varying vec3 vN;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vec3 p=position+normal*.12*sin(position.y*3.+t)*sin(position.x*3.+t*1.3);vP=(modelViewMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*vec4(vP,1.);}`;
const OS=`uniform float t;varying vec3 vN;varying vec3 vP;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(-vP))),2.);vec3 c=mix(vec3(.25,.55,.35),vec3(.92,.72,.38),f+.05*sin(t*.4));gl_FragColor=vec4(c*f*1.45+.03,.9);}`;
const R=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,50);cam.position.z=5;
const U={t:{value:0},r:{value:new THREE.Vector2()},m:{value:new THREE.Vector2()}};
const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:U,vertexShader:'void main(){gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:FS,depthTest:false,depthWrite:false}));bg.frustumCulled=false;bg.renderOrder=-1;S.add(bg);
const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,24),new THREE.ShaderMaterial({uniforms:{t:U.t},vertexShader:VS,fragmentShader:OS,transparent:true}));S.add(orb);
const size=()=>{const w=innerWidth,h=innerHeight,p=R.getPixelRatio();R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();U.r.value.set(w*p,h*p);orb.position.set(w>800?2.2:0,w>800?0:1.5,0);orb.scale.setScalar(w>800?1:.7)};
addEventListener('resize',size);size();
addEventListener('pointermove',e=>U.m.value.set(e.clientX/innerWidth-.5,.5-e.clientY/innerHeight));
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const loop=t=>{U.t.value=t/1000;orb.rotation.y=t/4000+U.m.value.x;orb.rotation.x=U.m.value.y*.5;R.render(S,cam);still||requestAnimationFrame(loop)};loop(0);
}catch(e){console.warn('WebGL unavailable',e)}
route();
</script></body></html>
